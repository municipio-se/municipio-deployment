name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'test-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Stage build secrets
        env:
          ACF_URL: ${{ secrets.ACF_URL }}
        run: |
          printf '%s' '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}' > "${RUNNER_TEMP}/composer_auth"
          if [ -n "$ACF_URL" ]; then
            printf '%s' "$ACF_URL" > "${RUNNER_TEMP}/acf_url"
          else
            : > "${RUNNER_TEMP}/acf_url"
            echo "::warning::ACF_URL secret not set; built image will not include ACF Pro."
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            composer_auth=${{ runner.temp }}/composer_auth
            acf_url=${{ runner.temp }}/acf_url
          cache-from: type=gha
          cache-to: type=gha,mode=max
