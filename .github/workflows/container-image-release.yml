name: Build container release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  packages: write

concurrency:
  group: municipio-image-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.context.outputs.version }}
      tags: ${{ steps.context.outputs.tags }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version and image tags
        id: context
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Source release tags must use X.Y.Z without a leading v."
            exit 1
          fi
          IFS=. read -r major minor _ <<< "$VERSION"

          token="$(curl -fsSu "$GHCR_USER:$GHCR_TOKEN" "https://ghcr.io/token?scope=repository:$REPO:pull" | jq -er .token)"
          listed_tags="$(REGISTRY_BEARER_TOKEN="$token" bash docker/scripts/list-ghcr-tags.sh "$REPO")"

          labels_of() {
            docker buildx imagetools inspect "$1" --format '{{json (index .Image "linux/amd64").Config.Labels}}' 2>/dev/null \
              || docker buildx imagetools inspect "$1" --format '{{json .Image.Config.Labels}}'
          }
          image_tags=("$IMAGE:v$VERSION")
          for floating in "v$major.$minor" "v$major" latest; do
            if grep -Fqx "$floating" <<< "$listed_tags"; then
              labels="$(labels_of "$IMAGE:$floating")"
              current="$(jq -er '."org.opencontainers.image.version" | strings' <<< "$labels")"
              if [[ -z "$current" ]]; then
                echo "::error::Could not read the version label from $IMAGE:$floating."
                exit 1
              fi
              newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
              if [[ "$newest" == "$VERSION" ]]; then
                image_tags+=("$IMAGE:$floating")
              else
                echo "Keeping $IMAGE:$floating on newer version $current."
              fi
            else
              image_tags+=("$IMAGE:$floating")
            fi
          done

          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            printf '%s\n' "${image_tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "Building \`$VERSION\` directly from its source tag." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            municipio-se.source-ref=${{ github.sha }}
            municipio-se.source-sha=${{ github.sha }}
            municipio-se.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secrets: |
            "acf_pro_key=${{ secrets.ACF_PRO_KEY }}"

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "platform_slug=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.platform_slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish final multi-platform images
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "::error::Expected two platform image digests, found ${#digests[@]}."
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("$IMAGE@sha256:$digest")
          done
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:v$VERSION"
