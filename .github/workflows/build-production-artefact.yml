name: Create production artefact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
      ACF_PRO_SITE_URL: ${{ secrets.ACF_PRO_SITE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v3
        with:
          node-version: 24.11.1

      - name: Setup PHP with composer v2.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ secrets.PHP_VERSION }}
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer Cache Directory.
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache composer packages.
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache node modules.
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # The next step merges composer.local.json and deletes composer.lock, so install resolves from the merged json.
      - name: Validate composer.json.
        run: composer validate --no-check-lock
        shell: bash

      - name: Merge composer.local.json (pre-install).
        run: |
          if [ -f composer-local-merge.php ]; then
            php composer-local-merge.php pre-install
          else
            echo "No composer-local-merge.php found - skipping local merge"
          fi
        shell: bash

      - name: Validate ACF PRO auth
        if: env.ACF_PRO_KEY == ''
        run: |
          echo "::error::ACF_PRO_KEY secret is required. ACF PRO is installed via Composer (wpengine/advanced-custom-fields-pro)."
          exit 1
        shell: bash

      - name: Configure Composer auth for ACF PRO
        run: composer config --global --auth http-basic.connect.advancedcustomfields.com
          "$ACF_PRO_KEY" "${ACF_PRO_SITE_URL:-https://www.alingsas.se}"
        shell: bash

      - name: Install composer dependencies.
        run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader --classmap-authoritative
        shell: bash

      - name: Restore composer files after local merge (post-install).
        run: |
          if [ -f composer-local-merge.php ]; then
            php composer-local-merge.php post-install
          else
            echo "No composer-local-merge.php found - skipping restore"
          fi
        shell: bash

      - name: Write composer versions info file.
        run: composer show >> composer.versions.md
        shell: bash

      - name: Inject access token in .npmrc.
        run: |
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com/helsingborg-stad" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
        shell: bash

      - name: Execute buildscripts in themes and plugins folders.
        run: php ./build.php --cleanup --no-composer-in-child-packages --install-npm
        shell: bash

      - name: Cleanup .npmrc
        run: rm ~/.npmrc
        shell: bash

      - name: Upload artefact.
        uses: actions/upload-artifact@v4
        with:
          name: production-artefact
          path: .
          retention-days: 7
