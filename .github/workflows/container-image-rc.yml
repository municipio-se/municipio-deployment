name: Build container release candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  packages: write

concurrency:
  group: municipio-image-rc-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      eligible: ${{ steps.context.outputs.eligible }}
      version: ${{ steps.context.outputs.version }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      rc: ${{ steps.context.outputs.rc }}
    steps:
      - name: Check release pull request
        id: context
        env:
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_DEFAULT_BRANCH: ${{ github.event.pull_request.base.repo.default_branch }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          TITLE_CHANGED: ${{ github.event.changes.title != null }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$ACTION" == edited && "$TITLE_CHANGED" != true ]]; then
            echo "Skipping edit that did not change the pull request title."
            exit 0
          fi
          if [[ "$BASE_REPO" != "$GITHUB_REPOSITORY" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Skipping release candidates from fork pull requests."
            exit 0
          fi
          if [[ "$BASE_REF" != "$BASE_DEFAULT_BRANCH" ]]; then
            echo "Skipping pull request targeting a non-default branch."
            exit 0
          fi
          if ! [[ "$TITLE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping pull request whose title is not X.Y.Z."
            exit 0
          fi

          # Number release candidates per version: the next rc is one above the
          # highest v<version>-rc.<N> tag already in GHCR, starting at rc.0.
          repo="${GITHUB_REPOSITORY,,}"
          token="$(curl -fsSL -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)"
          tags=""
          path="/v2/${repo}/tags/list?n=1000"
          body="$RUNNER_TEMP/ghcr-tags.json"
          headers="$RUNNER_TEMP/ghcr-tags.headers"
          while [[ -n "$path" ]]; do
            status="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
              -H "Authorization: Bearer $token" "https://ghcr.io${path}")"
            if [[ "$status" == 404 ]]; then
              echo "No existing image tags found for $repo."
              break
            fi
            if [[ "$status" != 200 ]]; then
              echo "::error::Listing GHCR tags failed with HTTP $status."
              cat "$body"
              exit 1
            fi
            tags+="$(jq -r '.tags // [] | .[]' "$body")"$'\n'
            path="$( (grep -i '^link:' "$headers" || true) \
              | sed -nE 's/.*<([^>]+)>;[[:space:]]*rel="next".*/\1/p' | tr -d '\r')"
          done

          latest="$(printf '%s' "$tags" \
            | (grep -E "^v${TITLE//./\\.}-rc\.[0-9]+$" || true) \
            | sed -E 's/.*-rc\.//' | sort -n | tail -n 1)"
          if [[ -n "$latest" ]]; then
            next=$((latest + 1))
          else
            next=0
          fi
          rc="v${TITLE}-rc.${next}"
          {
            echo "eligible=true"
            echo "version=$TITLE"
            echo "head_sha=$HEAD_SHA"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"
          echo "Building \`$rc\` from \`$HEAD_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A cold build takes a few minutes; a stalled package mirror must fail the
    # job instead of holding it for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "platform_slug=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # docker/Dockerfile extends the pinned official OpenLiteSpeed image and
      # builds Municipio into one image. The cache saves the app build and
      # Municipio-specific server configuration.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.head_sha }}
            municipio-se.source-ref=${{ needs.prepare.outputs.head_sha }}
            municipio-se.rc=${{ needs.prepare.outputs.rc }}
            municipio-se.pr=${{ github.event.pull_request.number }}
            municipio-se.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secrets: |
            "acf_pro_key=${{ secrets.ACF_PRO_KEY }}"
          cache-from: type=gha,scope=municipio-${{ env.platform_slug }}
          cache-to: type=gha,mode=min,scope=municipio-${{ env.platform_slug }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.platform_slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform release candidate
        working-directory: ${{ runner.temp }}/digests
        env:
          RC: ${{ needs.prepare.outputs.rc }}
        run: |
          shopt -s nullglob
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "::error::Expected two platform image digests, found ${#digests[@]}."
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$RC" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$RC"
