services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:80

    volumes:
      - ./php-ini-overrides.ini:/usr/local/lsws/lsphp83/etc/php/8.3/mods-available/zz-overrides.ini:cached
      - ..:/var/www/vhosts/localhost/html
      - ${HOME}/.ssh:/home/vscode/.ssh:ro

  redis:
    image: valkey/valkey:9.1.2
    command: >
      valkey-server --port 6379 --unixsocket /var/run/valkey/valkey.sock --unixsocketperm 777
    ports:
      - "6379:6379"
    volumes:
      - valkey-socket:/var/run/valkey

  db:
    image: mariadb:12.0.2
    restart: always
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - 8306:3306
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: mariadb
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: mariadb

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8090:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: mariadb

  typesense:
    image: typesense/typesense:30.2
    restart: always
    ports:
      - 8108:8108
    volumes:
      - typesense-data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'

  # S3-compatible object storage used to offload uploads instead of storing
  # them on the container filesystem.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9091:9091"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job that creates the bucket used by S3_UPLOADS_BUCKET on first
  # start; MinIO does not create buckets automatically.
  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/municipio && mc anonymous set download local/municipio "

volumes:
  mariadb-data:
  valkey-socket:
  typesense-data:
  minio-data: {}
  composer-cache:
