services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached
      # Mount host SSH keys read-only so SSH works without agent forwarding.
      # This is more reliable than forwarding SSH_AUTH_SOCK, which is often
      # unavailable when VS Code starts Docker.
      - ${HOME}/.ssh:/home/vscode/.ssh:ro

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    # network_mode: service:db

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)
  
  server:
    image: webbutvecklinghelsingborg/gitops:openlitespeed-0.0.4
    ports:
      - 8080:80
    volumes:
      - ./php-ini-overrides.ini:/usr/local/lsws/lsphp83/etc/php/8.3/mods-available/zz-overrides.ini:cached
      - ..:/var/www/vhosts/localhost/html:cached

  db:
    image: mariadb:12.0.2
    restart: always
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - 8306:3306
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: mariadb
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: mariadb

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8090:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: mariadb
    # Add "forwardPorts": ["3306"] to **devcontainer.json** to forward MariaDB locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  mariadb-data:
