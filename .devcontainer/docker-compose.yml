services:
  app:
    image: ghcr.io/helsingborg-stad/ols-docker-hbg:0.1.0-php8.3
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - 8080:80
    volumes:
      - ./php-ini-overrides.ini:/usr/local/lsws/lsphp83/etc/php/8.3/mods-available/zz-overrides.ini:cached
      - ..:/var/www/vhosts/localhost/html
      - ${HOME}/.ssh:/home/vscode/.ssh:ro

  redis:
    image: valkey/valkey:9.1.2
    command: >
      valkey-server --port 6379 --unixsocket /var/run/valkey/valkey.sock --unixsocketperm 777
    volumes:
      - valkey-socket:/var/run/valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: mariadb:12.0.2
    restart: always
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - 8306:3306
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: mariadb
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: mariadb
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=localhost", "--user=root", "--password=mariadb"]
      interval: 2s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8090:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: mariadb

  typesense:
    image: typesense/typesense:30.2
    restart: always
    ports:
      - 8108:8108
    volumes:
      - typesense-data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r -t 2 status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible object storage used to offload uploads instead of storing
  # them on the container filesystem.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9091:9091"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job that creates the bucket used by S3_UPLOADS_BUCKET on first
  # start; MinIO does not create buckets automatically.
  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/municipio && mc anonymous set download local/municipio "

volumes:
  mariadb-data:
  valkey-socket:
  typesense-data:
  minio-data: {}
  composer-cache:
