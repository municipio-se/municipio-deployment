services:
  app:
    # The same OpenLiteSpeed + lsphp server layer as the production image: the
    # `ols` stage of docker/Dockerfile (configured in docker/ols/). Rebuild the
    # dev container after changing anything under docker/ols/.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ols
    environment:
      # Dev-only PHP settings, applied by the image's ols-hbg-configure on every
      # start (written to mods-available/60-hbg-ini-settings.ini, read by both
      # web PHP and the php CLI). One `name=value` per line.
      #
      # The image ships opcache.validate_timestamps=0, so lsphp workers would
      # cache compiled code forever and never notice source edits; re-enable
      # timestamp checking with immediate revalidation.
      PHP_INI_SETTINGS: |
        opcache.validate_timestamps=1
        opcache.revalidate_freq=0
        auto_prepend_file=/var/www/vhosts/localhost/html/.devcontainer/config/codespaces-env.php
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - 8080:80
    volumes:
      - ..:/var/www/vhosts/localhost/html
      - ${HOME}/.ssh:/home/vscode/.ssh:ro

  redis:
    image: valkey/valkey:9.1.2
    command: >
      valkey-server --port 6379 --unixsocket /var/run/valkey/valkey.sock --unixsocketperm 777
    volumes:
      - valkey-socket:/var/run/valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: mariadb:12.0.2
    restart: always
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - 8306:3306
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: mariadb
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: mariadb
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=localhost", "--user=root", "--password=mariadb"]
      interval: 2s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8090:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: mariadb

  typesense:
    image: typesense/typesense:30.2
    restart: always
    ports:
      - 8108:8108
    volumes:
      - typesense-data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r -t 2 status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible object storage used to offload uploads instead of storing
  # them on the container filesystem.
  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9091:9091"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job that creates the bucket used by S3_UPLOADS_BUCKET on first
  # start; MinIO does not create buckets automatically.
  createbuckets:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        endpoint=http://minio:9000
        aws --endpoint-url "$$endpoint" s3api head-bucket --bucket municipio ||
          aws --endpoint-url "$$endpoint" s3api create-bucket --bucket municipio
        aws --endpoint-url "$$endpoint" s3api put-bucket-policy --bucket municipio --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::municipio/*"}]}'

volumes:
  mariadb-data:
  valkey-socket:
  typesense-data:
  minio-data: {}
  composer-cache:
 