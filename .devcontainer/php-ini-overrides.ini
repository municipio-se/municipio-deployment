; PHP ini overrides for this dev/debug environment, layered on top of the base
; image's lsphp config. Add further directives below as needed.

; The base image ships opcache.validate_timestamps=0 (in lsphp84's litespeed/php.ini),
; so lsphp workers cache compiled bytecode forever and never notice source file
; changes -- edits (even a die() at the top of index.php) silently have no effect
; until a worker restart. Re-enable timestamp checking (with immediate revalidation).
opcache.validate_timestamps=1
opcache.revalidate_freq=0