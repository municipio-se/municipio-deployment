services:
  municipio:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      secrets:
        - acf_pro_key
    environment:
      WP_CONF_DB_NAME: municipio
      WP_CONF_DB_USER: municipio
      WP_CONF_DB_PASSWORD: municipio
      WP_CONF_DB_HOST: db
      WP_CONF_WP_SITEURL: http://localhost:9090/wp
      WP_CONF_WP_HOME: http://localhost:9090
      WP_CONF_DB_TABLE_PREFIX: mun_
      WP_CONF_WP_SITE_TITLE: Municipio
      WP_CONF_WP_ADMIN_USER: admin
      WP_CONF_WP_ADMIN_PASSWORD: admin
      WP_CONF_WP_ADMIN_EMAIL: admin@example.com
      # Redis configuration
      WP_CONF_WP_REDIS_DISABLED: false
      WP_CONF_REDIS_HOST: redis
      WP_CONF_REDIS_SCHEME: unix
      WP_CONF_REDIS_PATH: /var/run/valkey/valkey.sock

    command: wp plugin activate redis-cache --allow-root

    depends_on:
      - db
      - redis
    ports:
      - "9090:80"

    volumes:
      - valkey-socket:/var/run/valkey

  db:
    extends:
      file: common-services.yml
      service: database

  redis:
    extends:
      file: common-services.yml
      service: redis

volumes:
  db-data: {}
  valkey-socket: {}

secrets:
  acf_pro_key:
    environment: ACF_PRO_KEY
