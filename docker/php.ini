; PHP settings for the Municipio image, loaded after php.ini-production.
; To override them at runtime, mount another .ini file into
; /usr/local/etc/php/conf.d/ with a name that sorts after this one.

expose_php = Off
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M

; The code in the image never changes, so skip file timestamp checks.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
