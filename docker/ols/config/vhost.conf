allowSymbolLink           1
enableScript              1
restrained                1
setUIDMode                2
vhRoot /var/www/vhosts/$VH_NAME/
configFile $SERVER_ROOT/conf/vhosts/$VH_NAME/vhconf.conf

virtualHostConfig  {
  docRoot                 $VH_ROOT/html/
  enableGzip              1

  # Missing files get WordPress's 404 page. PHP responses that are already
  # 404 (WordPress's own) are passed through unchanged.
  errorPage 404 {
    url                   /index.php?error=404
  }

  errorlog  {
    useServer             1
  }

  accesslog $SERVER_ROOT/logs/$VH_NAME.access.log {
    useServer             0
    rollingSize           10M
    keepDays              7
    compressArchive       1
  }

  index  {
    useServer             0
    indexFiles            index.html, index.php
    autoIndex             0
    autoIndexURI          /_autoindex/default.php
  }

  # Browser cache lifetimes: one year for media, scripts, styles and fonts.
  expires  {
    enableExpires         1
    expiresByType         application/pdf=A31557600, image/x-icon=A31557600, image/vnd.microsoft.icon=A31557600, image/svg+xml=A31557600, image/jpg=A31557600, image/jpeg=A31557600, image/png=A31557600, image/gif=A31557600, image/webp=A31557600, video/ogg=A31557600, audio/ogg=A31557600, video/mp4=A31557600, video/webm=A31557600, text/css=A31557600, text/javascript=A31557600, application/javascript=A31557600, application/x-javascript=A31557600, application/x-font-ttf=A31557600, application/x-font-woff=A31557600, application/font-woff=A31557600, application/font-woff2=A31557600, application/vnd.ms-fontobject=A31557600, font/ttf=A31557600, font/otf=A31557600, font/woff=A31557600, font/woff2=A31557600
  }

  accessControl  {
    allow                 *
  }

  # Response headers. OpenLiteSpeed ignores Header lines in .htaccess, so
  # they are set here, for every site type. Static assets get the same headers plus
  # Access-Control-Allow-Origin: * (fonts, scripts and images usable from other
  # sites); it is not set on pages and REST responses, where WordPress sends
  # its own CORS headers. Both contexts load the document root's .htaccess, so
  # rewrites (e.g. multisite /<site>/wp-content/...) apply to assets too.
  context exp:^/.*\.(js|css|html|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
    location              $DOC_ROOT/$0
    allowBrowse           1
    extraHeaders          <<<END_extraHeaders
Header always set Strict-Transport-Security "max-age=31536000"
Header set X-Content-Type-Options "nosniff"
Header set Referrer-Policy "strict-origin-when-cross-origin"
Header set Permissions-Policy "microphone=(), camera=(), geolocation=()"
Header set Access-Control-Allow-Origin "*"
END_extraHeaders

    rewrite  {
      RewriteFile .htaccess
    }
  }

  context / {
    location              $DOC_ROOT/
    allowBrowse           1
    extraHeaders          <<<END_extraHeaders
Header always set Strict-Transport-Security "max-age=31536000"
Header set X-Content-Type-Options "nosniff"
Header set Referrer-Policy "strict-origin-when-cross-origin"
Header set Permissions-Policy "microphone=(), camera=(), geolocation=()"
END_extraHeaders

    rewrite  {
      RewriteFile .htaccess
    }
  }

  # Rewrite rules shared by every site type. They run first, for every
  # request; the document root's .htaccess (copied per site type from
  # docker/wordpress/htaccess/) then adds the WordPress routing. At this level paths
  # start with "/".
  rewrite  {
    enable                1
    autoLoadHtaccess      1
    logLevel              0
    rules                 <<<END_rules
# LiteSpeed Cache: the rules the LiteSpeed Cache plugin would otherwise write
# to .htaccess. Pages are only cached when the plugin is active and marks them
# cacheable, so they are harmless without it.
RewriteRule litespeed/debug/.*\.log$ - [F,L]
RewriteRule (^|/)\.litespeed_conf\. - [F,L]
CacheLookup on
RewriteRule .* - [E=Cache-Control:no-autoflush]
RewriteCond %{REQUEST_URI} /wp-admin/admin-ajax\.php
RewriteCond %{QUERY_STRING} action=async_litespeed
RewriteRule .* - [E=noabort:1]
RewriteCond %{HTTP:Authorization} !^$
RewriteCond %{REQUEST_URI} /wp\-json(?:/|$) [OR]
RewriteCond %{QUERY_STRING} (^|&)rest_route=
RewriteRule .* - [E=Cache-Control:no-cache]
RewriteCond %{HTTP_COOKIE} (^|;\s*)wp-postpass_=
RewriteRule .* - [E=Cache-Control:no-cache]
CacheKeyModify -qs:fbclid
CacheKeyModify -qs:gclid
CacheKeyModify -qs:utm*
CacheKeyModify -qs:_ga

# Pass the Authorization header on to PHP (REST API, application passwords).
RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

# Remove www.
RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
RewriteRule ^/?(.*)$ https://%1/$1 [R=301,L]

# Append a slash to page URLs. Skips /wp/* and wp-* paths (also after a
# multisite subfolder, e.g. /<site>/wp-content/) and anything ending in a file
# extension (assets, robots.txt, PHP files).
RewriteCond %{REQUEST_URI} !^/([_0-9a-zA-Z-]+/)?wp[/-] [NC]
RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{1,8}$
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_URI} !(.*)/$
RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1/ [R=301,L]

# Block XML-RPC, trackbacks and signup, wherever requested (core is in /wp/).
RewriteRule (^|/)(xmlrpc|wp-trackback|wp-signup)\.php$ - [F,L]

# Hide author pages (?author=<id> user enumeration).
RewriteCond %{QUERY_STRING} ^author=([0-9]){1,}$ [NC]
RewriteRule ^(.*)$ $1?author=999999
END_rules
  }
}
