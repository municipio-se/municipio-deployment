# Local-only compose stack: pull the code-tree artifact image from GHCR
# and combine it with the OpenLiteSpeed runtime + entrypoint scripts from
# the sibling `municipio-docker/Municipio/templates/` directory.
#
# Usage from repo root:
#   cp .docker/.env.local.example .docker/.env.local
#   docker compose -f .docker/compose.local.yml --env-file .docker/.env.local up --build -d
#
# Requires `municipio-docker` checked out as a sibling of this repo.

services:
  database:
    image: mariadb:11.4
    container_name: municipio_local_db
    command: ["--max-allowed-packet=512M"]
    volumes:
      - ./data/db:/var/lib/mysql:delegated
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  litespeed:
    build:
      context: ../../municipio-docker/Municipio
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.7
        ARG APP_IMAGE
        FROM ${APP_IMAGE} AS app

        FROM mrspex/helsingborg:openlitespeed-0.0.1
        WORKDIR /var/www/vhosts/localhost/html

        # Bring in the production-built tree from our GHCR artifact.
        COPY --chown=1000:1000 --link --from=app / .

        # Mirror stage1.sh's final shaping: rename config-example -> config,
        # promote db/seed.sql so seed_db.sh can find it. Both are best-effort
        # so the wrapper still builds even if the artifact's layout shifts.
        RUN if [ -d config-example ]; then mv config-example config; fi \
         && if [ -f db/seed.sql ]; then cp db/seed.sql db_seed.sql; fi

        # Templates from municipio-docker/Municipio/templates/.
        COPY --chown=1000:1000 templates/htaccess .htaccess
        COPY --chown=1000:1000 --chmod=755 \
          templates/conf_database.sh templates/seed_db.sh templates/configure_wp.sh ./
        COPY --chown=1000:1000 --chmod=755 templates/entrypoint-wrapper.sh .

        # Seed shim: the artifact image does not yet carry db_seed.sql
        # (build.php --cleanup strips db/). If the host bind-mounts seed.sql
        # at /seed/seed.sql, copy it into place before the upstream entrypoint
        # runs. Then exec the upstream wrapper unchanged.
        RUN printf '%s\n' \
          '#!/bin/bash' \
          'set -euo pipefail' \
          'if [ -f /seed/seed.sql ] && [ ! -f ./db_seed.sql ]; then' \
          '  cp /seed/seed.sql ./db_seed.sql' \
          '  chown 1000:1000 ./db_seed.sql' \
          'fi' \
          'exec ./entrypoint-wrapper.sh "$@"' \
          > /seed-shim.sh && chmod +x /seed-shim.sh

        EXPOSE 80 7080 8088
        ENTRYPOINT ["/seed-shim.sh"]
      args:
        APP_IMAGE: ${APP_IMAGE}
    container_name: municipio_local
    tmpfs:
      - /var/www/vhosts/localhost/html/wp-content/uploads/cache:uid=1000,gid=1000
    volumes:
      - ../db/seed.sql:/seed/seed.sql:ro
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      INSTALL_DEMO_DB: ${INSTALL_DEMO_DB:-true}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: database
    ports:
      - "80:80"
      - "8088:8088"
      - "7080:7080"
    depends_on:
      database:
        condition: service_healthy
